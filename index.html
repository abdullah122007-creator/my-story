<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#120608">
<title>كأنكِ بعض الطمأنينة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--iv:#f4ead7;--gold:#b99a5e;--rose:#b98b90;--burg:#5b1628;--fs:20px}
html,body{height:100%;overflow:hidden;color:var(--iv);font-family:'IBM Plex Sans Arabic','Noto Naskh Arabic',Tahoma,sans-serif;background:radial-gradient(ellipse at 50% 40%,#3a1220,#1b0a10 48%,#0d0507)}
.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(185,154,94,.15),transparent 55%);animation:br 9s ease-in-out infinite alternate}
@keyframes br{to{opacity:.5;transform:scale(1.1)}}
#app{position:fixed;inset:0}
.sc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:20px;padding:70px 26px 44px;text-align:center;overflow-y:auto;animation:fi .9s ease both}
.sc>:first-child{margin-top:auto}.sc>:last-child{margin-bottom:auto}
.sc.out{animation:fo .5s ease both}
@keyframes fi{from{opacity:0;transform:translateY(14px)}}
@keyframes fo{to{opacity:0;transform:translateY(-10px)}}
.rv{opacity:0;animation:rv 1.5s ease forwards;animation-delay:var(--d,0s)}
@keyframes rv{to{opacity:1}}
h1,.v,.ct{font-family:Amiri,'Noto Naskh Arabic',serif}
h1{font-size:clamp(36px,11vw,56px);line-height:1.5}
.sub{color:var(--rose);font-size:18px;line-height:2.1;max-width:30em}
.v{font-size:clamp(22px,6.3vw,28px);line-height:2.2;max-width:24em}.v+.v{margin-top:-8px}
.bay{display:flex;flex-direction:column;gap:0;margin:8px 0}
.lab{color:var(--gold);font-size:14px;letter-spacing:.06em}.ct{font-size:30px;color:var(--gold)}
.btn{font:inherit;font-size:17px;color:var(--iv);background:rgba(91,22,40,.6);border:1px solid var(--gold);border-radius:30px;padding:12px 30px;min-height:48px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:.3s}
.btn:hover,.btn:active{background:var(--burg)}.btn:disabled{opacity:.5}
.btn.q{border-color:rgba(185,154,94,.3);color:var(--rose);background:none}
.row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
textarea{width:100%;max-width:30em;min-height:170px;resize:vertical;font:inherit;font-size:18px;line-height:2;color:var(--iv);background:rgba(244,234,215,.06);border:1px solid rgba(185,154,94,.5);border-radius:14px;padding:14px 16px;outline:none}
textarea:focus{border-color:var(--gold)}
.note{font-size:14px;line-height:1.9;color:var(--rose);max-width:28em}
#st{min-height:1.5em;font-size:15px;color:#e3b8b3;max-width:28em;line-height:1.8}
#bar{position:fixed;top:calc(20px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:5;pointer-events:none}
#bar i{width:7px;height:7px;border-radius:50%;background:rgba(244,234,215,.18);transition:.8s}
#bar i.on{background:var(--gold);box-shadow:0 0 10px var(--gold)}
.ib{position:fixed;top:calc(10px + env(safe-area-inset-top));z-index:6;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--gold);font:inherit;font-size:21px;cursor:pointer;opacity:.85}
#mu{left:8px}#mp{right:8px}#mu.off{opacity:.35}
#map{position:fixed;inset:0;z-index:20;background:rgba(10,3,5,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:30px}
#map.on{display:flex;animation:fi .5s both}
.stn{display:flex;align-items:center;gap:16px;width:min(300px,80vw);min-height:50px;position:relative;font-size:18px;color:var(--iv)}
.stn b{width:12px;height:12px;border-radius:50%;background:rgba(244,234,215,.2);flex:none;z-index:1}
.stn.on b{background:var(--gold);box-shadow:0 0 12px var(--gold)}
.stn:not(:last-of-type):before{content:"";position:absolute;right:5px;top:30px;height:44px;width:1px;background:rgba(185,154,94,.3)}
.stn span{opacity:.3}.stn.on span{opacity:1}
#bk{position:relative;width:min(86vw,390px);height:min(76dvh,610px);perspective:1600px}
.pg{position:absolute;inset:0;transform-origin:right center;transition:transform 1s cubic-bezier(.5,.05,.25,1),box-shadow 1s;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(270deg,#e6d9bb,#f6eddb 7%,#f4ead7);color:#2b1a14;border-radius:3px 9px 9px 3px;box-shadow:0 12px 30px rgba(0,0,0,.55)}
.pg.f{transform:rotateY(180deg);box-shadow:none}
.pi{position:absolute;inset:14px;border:1px solid rgba(139,98,60,.45);padding:22px 14px 34px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center}
.pi>div{margin:auto;width:100%}
.pi .v{font-size:var(--fs);line-height:1.9;color:#2b1a14;max-width:none;margin:0 auto}
.pi .bay{margin:12px 0}.pi .ch{font-family:Amiri,serif;font-size:calc(var(--fs) + 7px);color:#5b1628;line-height:1.7}
.pi .lab{color:#8a6a4a;margin-bottom:4px}.pn{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:#8a6a4a}
.pg.cv{background:linear-gradient(135deg,#5b1628,#240912);color:var(--gold);border-right:10px solid #2a0a14}
.pg.cv .pi{border:1px solid var(--gold);justify-content:center}.pg.cv .pi *{color:var(--gold)!important}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:16px;width:min(86vw,390px)}
.ctl .btn{padding:8px 13px;min-height:44px;font-size:15px;white-space:nowrap}.ctl .btn:disabled{visibility:hidden}.ctl .mid{flex:1;text-align:center;font-size:13px;color:var(--rose)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition-duration:.01s!important}}
</style></head><body>

const ORD=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن"];
const PICK=[[2,3],[0,1],[8,9],[2,5],[4,5],[0,1],[2,3],[0,2]];
const ST=[["بداية عابرة",1],["حديث أطول",2],["قرب غير متوقع",3],["طمأنينة",4],["تفاصيل صغيرة",5],["اعتراف مؤجل",7],["كلمة أخيرة",8]];
const $=id=>document.getElementById(id),app=$("app");
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const rv=(t,c,d)=>{const e=el("div",c,t);e.classList.add("rv");e.style.setProperty("--d",d+"s");return e};
const btn=(t,f,c,d)=>{const b=el("button","btn "+(c||""),t);b.onclick=f;if(d!=null){b.classList.add("rv");b.style.setProperty("--d",d+"s")}return b};
const lnk=(t,h,d)=>{const a=el("a","btn rv",t);a.href=h;a.target="_blank";a.rel="noopener";a.style.setProperty("--d",d+"s");return a};
let cur=0,step=0;
$("bar").append(...P.map(()=>el("i")));
function dots(){[...$("bar").children].forEach((d,i)=>d.classList.toggle("on",i<cur))}
function show(n){[...app.children].forEach(o=>{o.classList.add("out");setTimeout(()=>o.remove(),450)});app.append(n);n.scrollTop=0}
function bay(b,d,k){const w=el("div","bay");b.forEach((l,i)=>{const x=rv(l,"v",d+i*(k||1.6));w.append(x)});return w}
function sc(...c){const s=el("div","sc");s.append(...c);return s}
const STEPS=[home,intro];
P.forEach((_,i)=>STEPS.push(()=>chap(i)));
STEPS.splice(6,0,()=>inter("ثمّةَ أشياءُ تُقالُ بالصمتِ أكثرَ مما تُقالُ بالكلام."));
STEPS.splice(9,0,()=>inter("اقتربتِ الحكايةُ من آخرِها، وبقيَ أن تُقال."));
STEPS.push(confess);
function go(i){step=i;STEPS[i]()}
function nextBtn(t,d){return btn(t||"تابعي",()=>go(step+1),"",d)}
function home(){cur=0;dots();const h=el("h1","rv","كأنكِ بعض الطمأنينة");h.style.setProperty("--d","0.5s");show(sc(h,rv("«حكاية لم تبدأ بالحب، لكنها انتهت إليه.»","sub",2.2),btn("ابدئي الحكاية",()=>go(1),"",4.5),rv("الموسيقى اختيارية — زر ♪ في الأعلى","note",6)))}
function intro(){show(sc(rv("كانَ في الحكايةِ إنسانٌ يعبرُ أيامَهُ كما يعبرُها الجميع،","sub",0.5),rv("إلى أن وجدَ في حياتِهِ إنسانةً صارتْ له طمأنينةً وأمانًا.","sub",3),rv("هذه بعضُ ما قالَهُ عنها، على مهل.","sub",5.5),nextBtn("ابدئي القراءة",8)))}
function chap(i){cur=i+1;dots();const c=P[i],w=el("div","bay");let d=2.5;PICK[i].forEach(k=>{c.b[k].forEach(l=>{w.append(rv(l,"v",d));d+=1.7});d+=.8});show(sc(rv("الفصل "+ORD[i],"lab",0.3),rv(c.t,"ct",1),w,nextBtn("تابعي",d+1)))}
function inter(t){show(sc(rv(t,"sub",0.6),nextBtn("تابعي",3.5)))}
function has(m){return m.replace(/[\u064B-\u065F\u0670\u0640]/g,"").includes("بحبك")}
async function post(m){if(!CFG.endpoint)throw 0;const c=new AbortController,t=setTimeout(()=>c.abort(),20000);try{const r=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({m}),signal:c.signal});const j=await r.json();if(!j.ok)throw 0}finally{clearTimeout(t)}}
function confess(){cur=8;dots();const ta=el("textarea");ta.id="ta";ta.placeholder="اكتبي هنا ما تشعرين به…";ta.maxLength=4000;const st=el("div");st.id="st";
 const go1=btn("أرسلي",async()=>{const m=ta.value.trim();if(!m){st.textContent="اكتبي ما تشعرين به أولًا، أو اختاري «ليس الآن».";return}go1.disabled=true;st.textContent="…";try{await post(m)}catch(e){st.textContent="لم يصل ردكِ بعد ولم يُحفظ شيء. جرّبي مرة أخرى بعد قليل — ما كتبتِه ما زال هنا.";go1.disabled=false;return}has(m)?bookIntro():gentle()});
 const row=el("div","row rv");row.style.setProperty("--d","7s");row.append(go1,btn("ليس الآن",gentle,"q"));
 const box=el("div","rv");box.style.cssText="--d:6s;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px";box.append(ta,el("div","note","سيتم إرسال ردك إلى صاحب الرسالة وحفظه في سجل خاص حتى يتمكن من الاحتفاظ به ضمن ذكرى هذه الحكاية."),st);
 show(sc(rv("لقد رويتُ لكِ حكايتي، ووضعتُ بين يديكِ بعضًا من ذاتي...","sub",0.5),rv("والآن، جاء دوركِ...","v",3),rv("أريد أن أسمع حكايتكِ أنتِ.","sub",5),box,row))}
function gentle(){show(sc(rv("لا بأس إن لم تجدي الكلمات الآن... بعض المشاعر تحتاج وقتًا كي تُقال.","v",0.5),(()=>{const r=el("div","row");r.append(lnk("للتواصل عبر ماسنجر",CFG.messenger,3),btn("العودة إلى الرحلة",()=>go(1),"q",3.4),btn("إنهاء",home,"q",3.8));return r})()))}
function bookIntro(){show(sc(rv("لقد وصلتِ إلى الفصل الأخير...","v",0.5),rv("لكن الحكاية لم تكن كاملة حتى تقرئيها كلها.","sub",3),btn("افتحي الكتاب",openBook,"",6)))}
function openBook(){cur=8;dots();const pages=[];

/* music: original ambient pad + soft notes, generated live (no audio files) */
const M={x:null,on:false,n:0,
CH:[[146.83,174.61,220],[116.54,146.83,174.61],[174.61,220,261.63],[130.81,164.81,196]],
init(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;const x=this.x=new C,g=this.g=x.createGain();g.gain.value=0;const L=x.sampleRate*3,ir=x.createBuffer(2,L,x.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let k=0;k<L;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/L,2.5)}
 const cv=x.createConvolver();cv.buffer=ir;const lp=x.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1500;const b=this.bus=x.createGain();b.connect(lp);lp.connect(g);lp.connect(cv);cv.connect(g);g.connect(x.destination);return true},
note(f,t,d,ty,v,a){const x=this.x,o=x.createOscillator(),e=x.createGain();o.type=ty;o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(v,t+a);e.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(e);e.connect(this.bus);o.start(t);o.stop(t+d+.1)},
tick(){const t=this.x.currentTime+.05,c=this.CH[(this.n>>2)&3];if(!(this.n&3))c.forEach(f=>{this.note(f,t,12,"triangle",.07,3);this.note(f/2,t,12,"sine",.05,3)});this.note(c[this.n%3]*(this.n%5==4?4:2),t,5,"sine",.09,.02);this.n++},
toggle(){try{if(!this.x&&!this.init())return;this.on=!this.on;$("mu").classList.toggle("off",!this.on);if(this.on){this.x.resume();this.g.gain.setTargetAtTime(.4,this.x.currentTime,1.5);this.tick();this.iv=setInterval(()=>this.tick(),2800)}else{clearInterval(this.iv);this.g.gain.setTargetAtTime(0,this.x.currentTime,.6)}}catch(e){}}};
$("mu").classList.add("off");$("mu").onclick=()=>M.toggle();
go(0);
